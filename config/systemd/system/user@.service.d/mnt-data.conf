# Order the whole user manager after /mnt/data. User units (the media-stack
# Quadlets, qbittorrent-nox) cannot depend on system mounts themselves, so
# without this the disk is unmounted while they still hold it open:
#   umount: /mnt/data: target is busy.
# Shutdown reverses the order: the user manager stops before the unmount.
#
# WantsMountsFor (not RequiresMountsFor): a failed mount (e.g. dirty NTFS)
# must not take down the user manager, or PipeWire, the user bus and every
# other user service fail with it. Units that need the disk guard themselves
# with ExecStartPre=mountpoint -q /mnt/data.
[Unit]
WantsMountsFor=/mnt/data
