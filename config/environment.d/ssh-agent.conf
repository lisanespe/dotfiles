# SSH agent environment. Single source of truth:
#  - systemd reads it for user services (installed as ~/.config/environment.d/10-ssh-agent.conf)
#  - hyprland.lua parses it for apps launched from Hyprland
# Only ${VAR} expansion works here; unit specifiers like %t are NOT expanded.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
SSH_ASKPASS=/usr/bin/ksshaskpass
SSH_ASKPASS_REQUIRE=prefer
