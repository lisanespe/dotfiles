# keyd config for the SDINNOVATION SIDE-KEYBOARD (6 keys + volume knob).
# Installed at /etc/keyd/default.conf (see scripts/setup.sh). Re-run scripts/setup.sh to apply (it copies the file and restarts keyd)
#
# Physical layout, as logged with `keyd monitor`:
#   key 1 kp4    key 2 kp5    key 3 kp6
#   key 4 kp1    key 5 kp2    key 6 stopcd (sent natively by the pad)
#   knob  volumeup / volumedown (left as is, Hyprland handles XF86Audio*)
#
# F13-F15 are free keysyms; Hyprland binds them to workspaces 1-3.

[ids]
0816:246f

[main]
kp4 = previoussong
kp5 = playpause
kp6 = nextsong
kp1 = f13
kp2 = f14
stopcd = f15
