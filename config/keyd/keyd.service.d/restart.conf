# systemd drop-in for keyd.service, installed to
# /etc/systemd/system/keyd.service.d/restart.conf by scripts/setup.sh.
# keyd 2.6.0 can segfault (e.g. on `keyd reload`); the stock unit has
# Restart=no, which leaves the side keyboard unmapped until noticed.
[Service]
Restart=on-failure
RestartSec=1
