# ~/.config/hypr/hyprlock.conf
# hyprlock still uses hyprlang (not Lua like hyprland.lua).
# Based on /usr/share/hypr/hyprlock.conf, Tokyo Night palette to match
# Waybar (config/waybar/colors.css) and the window borders. Locked with
# SUPER+L, the Waybar power menu, or hypridle after 15 min idle.
# Wiki: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

$font   = UbuntuMono Nerd Font Propo
$fg     = rgb(c0caf5)
$blue   = rgb(7aa2f7)
$purple = rgb(bb9af7)
$red    = rgb(f7768e)
$green  = rgb(9ece6a)
$yellow = rgb(e0af68)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# Blurred screenshot of the desktop, darkened a bit so text stays readable
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(1a1b26cc)

    outer_color = $blue $purple 45deg
    check_color = $green
    fail_color = $red
    capslock_color = $yellow   # outline turns yellow while Caps Lock is on

    font_color = $fg
    font_family = $font
    fade_on_empty = false
    rounding = 8

    placeholder_text = <i>Password…</i>
    fail_text = $PAMFAIL
    dots_spacing = 0.3

    position = 0, -40
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 110
    font_family = $font

    position = 0, 160
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $purple
    font_size = 26
    font_family = $font

    position = 0, 60
    halign = center
    valign = center
}
