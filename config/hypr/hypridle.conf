# hypridle: lock at 15 min idle, monitor off at 1 h. No suspend.
# Waybar's idle_inhibitor button (or any app playing video) pauses this.

general {
    lock_cmd = pidof hyprlock || hyprlock          # loginctl lock-session
    before_sleep_cmd = loginctl lock-session       # lock before manual suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900                                  # 15 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 3600                                 # 1 h
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
