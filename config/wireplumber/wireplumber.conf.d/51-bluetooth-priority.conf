# Prefer Bluetooth headphones as the default output whenever they connect.
#
# WirePlumber picks the default sink in two steps:
#   1. The most recent available sink from the "configured" history
#      (~/.local/state/wireplumber/default-nodes, set by wpctl set-default/pavucontrol).
#   2. If none of those exist, the sink with the highest priority.session.
# This rule covers step 2: a high priority makes any bluez sink win over
# the analog jack (1009) and HDMI (~700) when no history applies.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        priority.driver  = 2000
        priority.session = 2000
      }
    }
  }
]
