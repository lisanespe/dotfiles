# Block the legacy joystick driver (joydev, /dev/input/js*).
# keyd's virtual pointer advertises axes, so joydev exposes it as a phantom
# joystick (js0). Waybar's keyboard-state module then logs
# "Can't create libevdev device: EINVAL" when it probes js0, and some games
# see a joystick that isn't there. Games and Steam use evdev, not joydev.
# Installed to /etc/modprobe.d/ by scripts/setup.sh.
blacklist joydev
